name: Deploy 3D viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install three.js for OBJ export
        run: npm ci --prefix tools --no-audit --no-fund

      - name: Regenerate 3D model, OBJ and drawings from chassis_geometry.py
        run: |
          python3 generate_3d.py
          python3 generate_assembly_drawings.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp viewer.html _site/index.html
          cp -r drawings _site/drawings
          cp buggy_frame_chassis.obj buggy_frame_chassis.mtl _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
