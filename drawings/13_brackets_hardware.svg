<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="1400" height="950" style="background:#0f172a; font-family:'Roboto', 'Segoe UI', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#64748b" stroke-width="1.5"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect x="20" y="20" width="1360" height="910" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="50.0" y="62.0" fill="#38bdf8" font-size="22" text-anchor="start" font-weight="bold">ТИПОВЫЕ КРОНШТЕЙНЫ, КРЕПЕЖ И МОМЕНТЫ ЗАТЯЖКИ</text>
  <text x="50.0" y="88.0" fill="#94a3b8" font-size="14" text-anchor="start" font-weight="normal">Уши сайлентблоков и амортизаторов, вставка ШС, имитатор ШРУС, проверка прочности рычага</text>
<text x="50.0" y="128.0" fill="#10b981" font-size="14" text-anchor="start" font-weight="bold">1. КРОНШТЕЙН САЙЛЕНТБЛОКА (П-скоба), М 1:2</text><rect x="80.0" y="270.0" width="100.0" height="30.0" rx="0" fill="#d97706" fill-opacity="1.0" stroke="#f59e0b" stroke-width="1.4"/><text x="130.0" y="290.0" fill="#0f172a" font-size="10" text-anchor="middle" font-weight="bold">балка 50x50</text><polygon points="85.0,270.0 85.0,180.0 90.0,162.0 95.0,180.0 95.0,270.0" fill="#92400e" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2" stroke-linejoin="round"/><polygon points="165.0,270.0 165.0,180.0 170.0,162.0 175.0,180.0 175.0,270.0" fill="#92400e" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2" stroke-linejoin="round"/><rect x="95.0" y="172.0" width="70.0" height="36.0" rx="4" fill="#475569" fill-opacity="1.0" stroke="#f8fafc" stroke-width="1.2"/><line x1="70.0" y1="190.0" x2="200.0" y2="190.0" stroke="#f87171" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="8,3,2,3"/><line x1="95.0" y1="172.0" x2="95.0" y2="160.0" stroke="#38bdf8" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3,2"/><line x1="165.0" y1="172.0" x2="165.0" y2="160.0" stroke="#38bdf8" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3,2"/><line x1="95.0" y1="156.0" x2="165.0" y2="156.0" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="130.0" y="151.0" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(0.0,130.0,151.0)" dominant-baseline="auto">L втулки + 0.5</text><rect x="300.0" y="140.0" width="540.0" height="136.0" rx="4" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1"/><text x="312.0" y="162.0" fill="#38bdf8" font-size="13" text-anchor="start" font-weight="bold">Требования</text><text x="312.0" y="182.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Пластины 5 мм 09Г2С, отв. Ø12.2 (M12 10.9), сверлить парой в сборе.</text><text x="312.0" y="199.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Втулка рычага: труба Ø под сайлентблок с натягом 0.1...0.2 мм.</text><text x="312.0" y="216.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Сайлентблок 2108 нижнего рычага (или ПУ) — запрессовка после сварки.</text><text x="312.0" y="233.0" fill="#f87171" font-size="11" text-anchor="start" font-weight="normal">Болты сайлентблоков тянуть ТОЛЬКО под статической нагрузкой</text><text x="312.0" y="250.0" fill="#f87171" font-size="11" text-anchor="start" font-weight="normal">(машина на колесах) — иначе резина порвется на ходе.</text><text x="312.0" y="267.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Оси двух ушей одного рычага — соосно (пруток-оправка при сварке).</text><text x="50.0" y="350.0" fill="#10b981" font-size="14" text-anchor="start" font-weight="bold">2. ВЕРХНИЙ РЫЧАГ: ВСТАВКА ПОД ШС M16x1.5</text><rect x="80.0" y="380.0" width="170.0" height="40.0" rx="0" fill="#0ea5e9" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1.4"/><rect x="200.0" y="385.0" width="70.0" height="30.0" rx="0" fill="#64748b" fill-opacity="1.0" stroke="#f8fafc" stroke-width="1.2"/><rect x="270.0" y="392.0" width="50.0" height="16.0" rx="0" fill="#94a3b8" fill-opacity="1.0" stroke="#f8fafc" stroke-width="1"/><rect x="275.0" y="388.0" width="10.0" height="24.0" rx="0" fill="#f59e0b" fill-opacity="1.0" stroke="#f59e0b" stroke-width="1"/><circle cx="345.0" cy="400.0" r="22.0" fill="#475569" stroke="#f8fafc" stroke-width="1.5"/><circle cx="345.0" cy="400.0" r="8.0" fill="#0f172a" stroke="#f8fafc" stroke-width="1.2"/><line x1="200.0" y1="420.0" x2="200.0" y2="438.0" stroke="#38bdf8" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3,2"/><line x1="270.0" y1="420.0" x2="270.0" y2="438.0" stroke="#38bdf8" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3,2"/><line x1="200.0" y1="434.0" x2="270.0" y2="434.0" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="235.0" y="439.0" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(0.0,235.0,439.0)" dominant-baseline="hanging">≥ 24</text><text x="400.0" y="394.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">бобышка Ø30 с резьбой M16x1.5 вварена в торец трубы,</text><text x="400.0" y="411.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">резьба в зацеплении не менее 24 мм; контргайка (оранж.)</text><text x="400.0" y="428.0" fill="#f59e0b" font-size="11" text-anchor="start" font-weight="normal">1 оборот ШС = 1.5 мм = ~0.28° развала</text><text x="50.0" y="490.0" fill="#10b981" font-size="14" text-anchor="start" font-weight="bold">3. ДВОЙНОЕ УХО АМОРТИЗАТОРА</text><polygon points="100.0,610.0 100.0,540.0 112.0,520.0 124.0,540.0 124.0,610.0" fill="#92400e" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2" stroke-linejoin="round"/><polygon points="146.0,610.0 146.0,540.0 158.0,520.0 170.0,540.0 170.0,610.0" fill="#92400e" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2" stroke-linejoin="round"/><rect x="112.0" y="532.0" width="46.0" height="18.0" rx="0" fill="#475569" fill-opacity="1.0" stroke="#f8fafc" stroke-width="1"/><line x1="90.0" y1="541.0" x2="190.0" y2="541.0" stroke="#f87171" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="8,3,2,3"/><text x="220.0" y="540.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">пластины 5 мм, зазор = ширина втулки аморт. + 0.5</text><text x="220.0" y="558.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">отв. по болту аморт. (обычно M10 / M12), болт в двойном срезе</text><text x="220.0" y="576.0" fill="#f59e0b" font-size="11" text-anchor="start" font-weight="normal">на нижнем рычаге — на поперечину жесткости, не на один луч</text><text x="50.0" y="650.0" fill="#10b981" font-size="14" text-anchor="start" font-weight="bold">4. ПЕРЕДНЯЯ (НЕВЕДУЩАЯ) СТУПИЦА: ИМИТАТОР ШРУС</text><rect x="150.0" y="690.0" width="90.0" height="110.0" rx="4" fill="#475569" fill-opacity="1.0" stroke="#94a3b8" stroke-width="1.4"/><text x="195.0" y="815.0" fill="#94a3b8" font-size="10" text-anchor="middle" font-weight="normal">кулак</text><rect x="170.0" y="720.0" width="50.0" height="50.0" rx="0" fill="#64748b" fill-opacity="1.0" stroke="#f8fafc" stroke-width="1.2"/><text x="195.0" y="750.0" fill="#f8fafc" font-size="10" text-anchor="middle" font-weight="normal">подш.</text><rect x="220.0" y="705.0" width="60.0" height="80.0" rx="0" fill="#334155" fill-opacity="1.0" stroke="#f8fafc" stroke-width="1.2"/><text x="250.0" y="798.0" fill="#94a3b8" font-size="10" text-anchor="middle" font-weight="normal">ступица</text><rect x="80.0" y="715.0" width="70.0" height="60.0" rx="6" fill="#f59e0b" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1.2"/><text x="115.0" y="790.0" fill="#f59e0b" font-size="10" text-anchor="middle" font-weight="normal">обрезок</text><text x="115.0" y="803.0" fill="#f59e0b" font-size="10" text-anchor="middle" font-weight="normal">корпуса ШРУС</text><rect x="150.0" y="735.0" width="160.0" height="20.0" rx="0" fill="#f59e0b" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1"/><rect x="285.0" y="730.0" width="20.0" height="30.0" rx="0" fill="#f8fafc" fill-opacity="1.0" stroke="#f8fafc" stroke-width="1"/><text x="330.0" y="740.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">гайка M20x1.5, 225...250 Нм</text><text x="330.0" y="758.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Хвостовик со шлицами и упорный торец — от наружного</text><text x="330.0" y="776.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">ШРУС 2108 (б/у); чашку срезать. Стягивает внутренние</text><text x="330.0" y="794.0" fill="#f87171" font-size="11" text-anchor="start" font-weight="normal">кольца подшипника — без него подшипник разрушится.</text><rect x="880.0" y="112.0" width="470.0" height="150.0" rx="3" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1"/><text x="886.0" y="126.0" fill="#38bdf8" font-size="11" text-anchor="start" font-weight="bold">Резьба (класс)</text><text x="1036.0" y="126.0" fill="#38bdf8" font-size="11" text-anchor="start" font-weight="bold">Нм</text><text x="1126.0" y="126.0" fill="#38bdf8" font-size="11" text-anchor="start" font-weight="bold">Где</text><line x1="880.0" y1="132.0" x2="1350.0" y2="132.0" stroke="#64748b" stroke-width="1.0" stroke-linecap="round"/><text x="886.0" y="146.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">M8 (8.8)</text><text x="1036.0" y="146.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">25</text><text x="1126.0" y="146.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">кронштейны, хомуты</text><text x="886.0" y="164.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">M10 (8.8 / 10.9)</text><text x="1036.0" y="164.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">50 / 70</text><text x="1126.0" y="164.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">аморт., шаровая к рычагу*</text><text x="886.0" y="182.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">M12 (8.8 / 10.9)</text><text x="1036.0" y="182.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">85 / 110</text><text x="1126.0" y="182.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">сайлентблоки, АД-01 к кулаку</text><text x="886.0" y="200.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">M12x1.25 колесо</text><text x="1036.0" y="200.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">65...90</text><text x="1126.0" y="200.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">болты колеса ВАЗ</text><text x="886.0" y="218.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">M14 (10.9)</text><text x="1036.0" y="218.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">180</text><text x="1126.0" y="218.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">подушки КПП, плита</text><text x="886.0" y="236.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">M16x1.5 (10.9)</text><text x="1036.0" y="236.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">250</text><text x="1126.0" y="236.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">ось ШС верх. рычага</text><text x="886.0" y="254.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">M20x1.5 ступица</text><text x="1036.0" y="254.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">225...250</text><text x="1126.0" y="254.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">гайка ступицы 2108</text><rect x="880.0" y="278.0" width="470.0" height="96.0" rx="3" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1"/><text x="886.0" y="292.0" fill="#38bdf8" font-size="11" text-anchor="start" font-weight="bold">Труба нижнего рычага</text><text x="1076.0" y="292.0" fill="#38bdf8" font-size="11" text-anchor="start" font-weight="bold">σ, МПа (3g)</text><text x="1196.0" y="292.0" fill="#38bdf8" font-size="11" text-anchor="start" font-weight="bold">Запас (Ст20)</text><line x1="880.0" y1="298.0" x2="1350.0" y2="298.0" stroke="#64748b" stroke-width="1.0" stroke-linecap="round"/><text x="886.0" y="312.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">25x25x2.0</text><text x="1076.0" y="312.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">278</text><text x="1196.0" y="312.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">0.88</text><text x="886.0" y="330.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">30x30x2.5</text><text x="1076.0" y="330.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">156</text><text x="1196.0" y="330.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">1.57</text><text x="886.0" y="348.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">40x20x2.0 (на ребро)</text><text x="1076.0" y="348.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">164</text><text x="1196.0" y="348.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">1.50</text><text x="886.0" y="366.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">40x40x2.0</text><text x="1076.0" y="366.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">99</text><text x="1196.0" y="366.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">2.47</text><rect x="880.0" y="384.0" width="470.0" height="119.0" rx="4" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1"/><text x="892.0" y="406.0" fill="#f87171" font-size="13" text-anchor="start" font-weight="bold">ВЫВОД ПО РЫЧАГАМ</text><text x="892.0" y="426.0" fill="#f87171" font-size="11" text-anchor="start" font-weight="normal">Труба 25x25x2 (лист 02) на нижнем рычаге — запас 0.88 &lt; 1.</text><text x="892.0" y="443.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Нижний рычаг: 30x30x2.5 или 40x20x2 на ребро + поперечина</text><text x="892.0" y="460.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">   под ухо амортизатора. Верхний: 25x25x2 допустим.</text><text x="892.0" y="477.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Все крепежные детали — класс 10.9, гайки самоконтрящиеся</text><text x="892.0" y="494.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">   или с фиксатором резьбы. * — шаровую 2108 сверить по донору.</text>

  <g transform="translate(980, 812)">
    <rect width="380" height="104" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="0" y1="34" x2="380" y2="34" stroke="#64748b"/><line x1="0" y1="68" x2="380" y2="68" stroke="#64748b"/>
    <line x1="90" y1="0" x2="90" y2="104" stroke="#64748b"/>
    <text x="12.0" y="22.0" fill="#94a3b8" font-size="12" text-anchor="start" font-weight="normal">Узел:</text><text x="100.0" y="22.0" fill="#f8fafc" font-size="13" text-anchor="start" font-weight="bold">Кронштейны и крепеж</text>
    <text x="12.0" y="56.0" fill="#94a3b8" font-size="12" text-anchor="start" font-weight="normal">Материал:</text><text x="100.0" y="56.0" fill="#f8fafc" font-size="12" text-anchor="start" font-weight="normal">09Г2С t=5, крепеж 10.9</text>
    <text x="12.0" y="90.0" fill="#94a3b8" font-size="12" text-anchor="start" font-weight="normal">Чертеж:</text><text x="100.0" y="90.0" fill="#38bdf8" font-size="12" text-anchor="start" font-weight="normal">13-BRACKETS / М 1:2 / лист 13</text>
  </g>
</svg>