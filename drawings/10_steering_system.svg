    <text x="12.0" y="56.0" fill="#94a3b8" font-size="12" text-anchor="start" font-weight="normal">Материал:</text><text x="100.0" y="56.0" fill="#f8fafc" font-size="12" text-anchor="start" font-weight="normal">Рейка UTV + карданы ВАЗ</text>
    <text x="12.0" y="90.0" fill="#94a3b8" font-size="12" text-anchor="start" font-weight="normal">Чертеж:</text><text x="100.0" y="90.0" fill="#38bdf8" font-size="12" text-anchor="start" font-weight="normal">10-STEER / М 1:25 / 1:15 / лист 10</text>
  </g>
