<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="1400" height="950" style="background:#0f172a; font-family:'Roboto', 'Segoe UI', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#64748b" stroke-width="1.5"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect x="20" y="20" width="1360" height="910" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="50.0" y="62.0" fill="#38bdf8" font-size="22" text-anchor="start" font-weight="bold">РУЛЕВОЕ УПРАВЛЕНИЕ: ТРАПЕЦИЯ, РЕЙКА, КОЛОНКА</text>
  <text x="50.0" y="88.0" fill="#94a3b8" font-size="14" text-anchor="start" font-weight="normal">Рейка за осью колес, рычаги АД-01 назад; колонка с двумя карданами</text>
<text x="50.0" y="128.0" fill="#10b981" font-size="14" text-anchor="start" font-weight="bold">РУЛЕВАЯ ТРАПЕЦИЯ (вид сверху), М 1:25</text><line x1="105.0" y1="682.6" x2="435.0" y2="682.6" stroke="#64748b" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="18,4,3,4"/><text x="419.6" y="673.8" fill="#94a3b8" font-size="10" text-anchor="start" font-weight="normal">задняя ось</text><polygon points="393.8,295.2 432.2,295.2 432.2,168.0 393.8,168.0" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/><polygon points="424.3,288.1 458.1,269.6 397.3,158.0 363.5,176.4" fill="none" fill-opacity="1.0" stroke="#a78bfa" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6,3"/><polygon points="393.8,295.2 432.2,295.2 432.2,168.0 393.8,168.0" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/><rect x="393.8" y="621.0" width="38.5" height="123.2" rx="4" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1.2"/><polygon points="107.8,295.2 146.2,295.2 146.2,168.0 107.8,168.0" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/><polygon points="154.8,304.6 185.1,280.9 106.8,180.7 76.5,204.4" fill="none" fill-opacity="1.0" stroke="#a78bfa" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6,3"/><polygon points="107.8,295.2 146.2,295.2 146.2,168.0 107.8,168.0" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/><rect x="107.8" y="621.0" width="38.5" height="123.2" rx="4" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1.2"/><line x1="144.9" y1="231.6" x2="270.0" y2="682.6" stroke="#f87171" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="10,4"/><line x1="395.1" y1="231.6" x2="270.0" y2="682.6" stroke="#f87171" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="10,4"/><line x1="395.1" y1="231.6" x2="382.1" y2="258.0" stroke="#a78bfa" stroke-width="4.0" stroke-linecap="round"/><line x1="317.3" y1="258.0" x2="382.1" y2="258.0" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/><line x1="144.9" y1="231.6" x2="157.9" y2="258.0" stroke="#a78bfa" stroke-width="4.0" stroke-linecap="round"/><line x1="222.7" y1="258.0" x2="157.9" y2="258.0" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/><rect x="222.7" y="254.0" width="94.5" height="7.9" rx="4" fill="#475569" fill-opacity="1.0" stroke="#a78bfa" stroke-width="1.2"/><text x="270.0" y="667.2" fill="#f87171" font-size="10" text-anchor="middle" font-weight="normal">линии рычагов сходятся на центре задней оси = 100% Аккерман</text><text x="91.8" y="159.0" fill="#a78bfa" font-size="12" text-anchor="start" font-weight="bold">внутр. 38°</text><text x="399.8" y="159.0" fill="#a78bfa" font-size="12" text-anchor="start" font-weight="bold">наруж. 28.6°</text><line x1="100.6" y1="231.6" x2="106.6" y2="231.6" stroke="#38bdf8" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3,2"/><line x1="100.6" y1="682.6" x2="106.6" y2="682.6" stroke="#38bdf8" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3,2"/><line x1="110.6" y1="231.6" x2="110.6" y2="682.6" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="115.6" y="457.1" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(90.0,115.6,457.1)" dominant-baseline="auto">2050 (БАЗА)</text><text x="560.0" y="420.0" fill="#10b981" font-size="14" text-anchor="start" font-weight="bold">РУЛЕВАЯ КОЛОНКА (вид сбоку слева), М 1:15</text><line x1="560.0" y1="760.0" x2="1024.0" y2="760.0" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/><circle cx="976.0" cy="670.4" r="89.6" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="963.2" y="753.6" fill="#94a3b8" font-size="10" text-anchor="end" font-weight="normal">перед. ось</text><line x1="934.4" y1="632.6" x2="838.4" y2="580.8" stroke="#a78bfa" stroke-width="4.0" stroke-linecap="round"/><line x1="838.4" y1="580.8" x2="732.8" y2="539.2" stroke="#a78bfa" stroke-width="4.0" stroke-linecap="round"/><line x1="732.8" y1="539.2" x2="636.8" y2="497.6" stroke="#f8fafc" stroke-width="6.0" stroke-linecap="round"/><circle cx="732.8" cy="539.2" r="6.0" fill="#f59e0b" stroke="#f8fafc" stroke-width="1.2"/><circle cx="838.4" cy="580.8" r="6.0" fill="#f59e0b" stroke="#f8fafc" stroke-width="1.2"/><circle cx="934.4" cy="632.6" r="7.0" fill="#475569" stroke="#a78bfa" stroke-width="1.5"/><line x1="617.6" y1="445.0" x2="656.0" y2="550.2" stroke="#f8fafc" stroke-width="7.0" stroke-linecap="round"/><rect x="840.0" y="654.4" width="16.0" height="16.0" rx="0" fill="#d97706" fill-opacity="1.0" stroke="#f59e0b" stroke-width="1.2"/><line x1="636.8" y1="497.6" x2="576.0" y2="446.4" stroke="#94a3b8" stroke-width="0.9" stroke-linecap="round"/><circle cx="636.8" cy="497.6" r="2.2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/><text x="580.0" y="450.4" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">руль Ø350</text><line x1="684.8" y1="518.4" x2="608.0" y2="568.0" stroke="#94a3b8" stroke-width="0.9" stroke-linecap="round"/><circle cx="684.8" cy="518.4" r="2.2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/><text x="612.0" y="572.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">вал Ø20 в 2 подшипниках (кронштейн на дуге)</text><line x1="732.8" y1="539.2" x2="777.6" y2="497.6" stroke="#94a3b8" stroke-width="0.9" stroke-linecap="round"/><circle cx="732.8" cy="539.2" r="2.2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/><text x="781.6" y="501.6" fill="#f59e0b" font-size="11" text-anchor="start" font-weight="normal">кардан 1 (рулевой ВАЗ)</text><line x1="838.4" y1="580.8" x2="880.0" y2="542.4" stroke="#94a3b8" stroke-width="0.9" stroke-linecap="round"/><circle cx="838.4" cy="580.8" r="2.2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/><text x="884.0" y="546.4" fill="#f59e0b" font-size="11" text-anchor="start" font-weight="normal">кардан 2</text><line x1="934.4" y1="632.6" x2="1001.6" y2="580.8" stroke="#94a3b8" stroke-width="0.9" stroke-linecap="round"/><circle cx="934.4" cy="632.6" r="2.2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/><text x="1005.6" y="584.8" fill="#a78bfa" font-size="11" text-anchor="start" font-weight="normal">шестерня рейки</text><text x="838.4" y="664.0" fill="#f59e0b" font-size="10" text-anchor="end" font-weight="normal">поперечина пола</text><text x="560.0" y="800.0" fill="#f59e0b" font-size="11" text-anchor="start" font-weight="normal">Углы в карданах: 2° и 7° (допуск ≤ 30°).</text><text x="560.0" y="818.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">Вилки промвала — в одной плоскости.</text><text x="560.0" y="836.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">Положение руля — по сиденью (на месте).</text><rect x="880.0" y="112.0" width="470.0" height="150.0" rx="3" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1"/><text x="886.0" y="126.0" fill="#38bdf8" font-size="11" text-anchor="start" font-weight="bold">Требование к рейке</text><text x="1066.0" y="126.0" fill="#38bdf8" font-size="11" text-anchor="start" font-weight="bold">Значение</text><line x1="880.0" y1="132.0" x2="1350.0" y2="132.0" stroke="#64748b" stroke-width="1.0" stroke-linecap="round"/><text x="886.0" y="146.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">Тип</text><text x="1066.0" y="146.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">рейка с торцевым отбором тяг (UTV / багги)</text><text x="886.0" y="164.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">Межцентр. внутр. шарниров</text><text x="1066.0" y="164.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">430 ± 10 мм (в среднем положении)</text><text x="886.0" y="182.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">Ход рейки</text><text x="1066.0" y="182.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">не менее ±65 мм + упоры</text><text x="886.0" y="200.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">Высота / положение</text><text x="1066.0" y="200.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Y = 428 мм, Z = -120 мм от оси</text><text x="886.0" y="218.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">Передаточное</text><text x="1066.0" y="218.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">2.0...2.5 оборота руля от упора до упора</text><text x="886.0" y="236.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">Крепление</text><text x="1066.0" y="236.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">2 хомута на поперечину 40x40, болты M10</text><text x="886.0" y="254.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">Тяга (проекция)</text><text x="1066.0" y="254.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">296 мм, наконечник ШС M12</text><rect x="880.0" y="274.0" width="470.0" height="153.0" rx="4" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1"/><text x="892.0" y="296.0" fill="#f59e0b" font-size="13" text-anchor="start" font-weight="bold">РЕЗУЛЬТАТ РАСЧЕТА</text><text x="892.0" y="316.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Радиус разворота по наружному колесу: 4.36 м</text><text x="892.0" y="333.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Кастер 4.7° (самовозврат руля), KPI 12.9°</text><text x="892.0" y="350.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Подруливание на ходе ±0.02° — практически ноль (лист 09)</text><text x="892.0" y="367.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Упоры угла поворота: болт M10 с контргайкой на нижнем рычаге,</text><text x="892.0" y="384.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">   ограничить внутреннее колесо 38° (шина не трет раму/рычаг).</text><text x="892.0" y="401.0" fill="#f87171" font-size="11" text-anchor="start" font-weight="normal">Если высота рейки отличается от расчетной более чем на 10 мм —</text><text x="892.0" y="418.0" fill="#f87171" font-size="11" text-anchor="start" font-weight="normal">подруливание резко растет. Высоту выставлять проставками хомутов.</text>

