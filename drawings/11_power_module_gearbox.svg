  <rect x="20" y="20" width="1360" height="910" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="50.0" y="62.0" fill="#38bdf8" font-size="22" text-anchor="start" font-weight="bold">СИЛОВОЙ МОДУЛЬ: QS138 → ЦЕПЬ 520 → КПП 2108 → ПРИВОДЫ</text>
  <text x="50.0" y="88.0" fill="#94a3b8" font-size="14" text-anchor="start" font-weight="normal">Заменяет лист 04 (сплошной вал на UCP206 несовместим с IRS). КПП 2108 = редуктор + дифференциал + понижающие передачи</text>
<rect x="50.0" y="112.0" width="800.0" height="119.0" rx="4" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1"/><text x="62.0" y="134.0" fill="#f87171" font-size="13" text-anchor="start" font-weight="bold">ПРИВОДЫ И ПОДРАМНИК (по месту)</text><text x="62.0" y="154.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Длина между центрами ШРУС 445 мм, осевой ход -13/+9 мм, угол ≤ 12° — укоротить оба привода 2108 до одинаковой длины (токарная услуга).</text><text x="62.0" y="171.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Сзади X/Y шарниров — как на листе 07, кастер 0. Z (от оси): нижний +80/-200, верхний +200/+20, аморт. -100, тяга схожд. +120 (АД-01 Л&lt;-&gt;П).</text><text x="62.0" y="188.0" fill="#f87171" font-size="11" text-anchor="start" font-weight="normal">КПП сначала примерить: зазор до рычагов и балок ≥ 15 мм на всех ходах подвески.</text><text x="62.0" y="205.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Корпус КПП развернуть назад-вверх вокруг оси дифференциала — приводы не меняются.</text><text x="62.0" y="222.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">* — размер по фактическому положению выходов дифференциала.</text><text x="50.0" y="290.0" fill="#10b981" font-size="14" text-anchor="start" font-weight="bold">ВИД СЗАДИ НА СИЛОВОЙ МОДУЛЬ, М 1:8 (компоновка)</text><line x1="54.0" y1="880.0" x2="846.0" y2="880.0" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/><line x1="450.0" y1="885.5" x2="450.0" y2="440.0" stroke="#64748b" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="18,4,3,4"/><line x1="521.5" y1="726.0" x2="766.2" y2="726.0" stroke="#94a3b8" stroke-width="14.3" stroke-linecap="round"/><circle cx="521.5" cy="726.0" r="24.8" fill="#475569" stroke="#f8fafc" stroke-width="1.4"/><circle cx="766.2" cy="726.0" r="23.1" fill="#475569" stroke="#f8fafc" stroke-width="1.4"/><rect x="759.4" y="572.0" width="96.3" height="308.0" rx="10" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1.5"/><line x1="378.5" y1="726.0" x2="133.8" y2="726.0" stroke="#94a3b8" stroke-width="14.3" stroke-linecap="round"/><circle cx="378.5" cy="726.0" r="24.8" fill="#475569" stroke="#f8fafc" stroke-width="1.4"/><circle cx="133.8" cy="726.0" r="23.1" fill="#475569" stroke="#f8fafc" stroke-width="1.4"/><rect x="44.4" y="572.0" width="96.3" height="308.0" rx="10" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1.5"/><polygon points="483.0,775.5 285.0,775.5 285.0,621.5 340.0,572.0 483.0,572.0 516.0,621.5 516.0,737.0" fill="#334155" fill-opacity="0.9" stroke="#38bdf8" stroke-width="2.0" stroke-linejoin="round" stroke-dasharray="8,4"/><text x="356.5" y="605.0" fill="#38bdf8" font-size="15" text-anchor="middle" font-weight="bold">КПП 2108</text><text x="356.5" y="621.5" fill="#94a3b8" font-size="10" text-anchor="middle" font-weight="normal">габарит — снять с донора</text><circle cx="450.0" cy="726.0" r="33.0" fill="#475569" stroke="#f8fafc" stroke-width="1.5"/><text x="450.0" y="730.4" fill="#f8fafc" font-size="11" text-anchor="middle" font-weight="normal">диф.</text><polygon points="384.0,715.0 510.5,737.0 510.5,594.0 384.0,605.0" fill="#475569" fill-opacity="0.8" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/><rect x="510.5" y="561.0" width="7.7" height="220.0" rx="0" fill="#d97706" fill-opacity="1.0" stroke="#f59e0b" stroke-width="1.6"/><line x1="518.2" y1="649.0" x2="600.7" y2="649.0" stroke="#f8fafc" stroke-width="13.8" stroke-linecap="round"/><rect x="526.5" y="627.0" width="16.5" height="44.0" rx="3" fill="#64748b" fill-opacity="1.0" stroke="#f8fafc" stroke-width="1.2"/><rect x="565.0" y="627.0" width="16.5" height="44.0" rx="3" fill="#64748b" fill-opacity="1.0" stroke="#f8fafc" stroke-width="1.2"/><rect x="587.0" y="602.2" width="4.4" height="93.5" rx="0" fill="#f59e0b" fill-opacity="1.0" stroke="#f59e0b" stroke-width="1"/><rect x="595.2" y="594.0" width="3.3" height="110.0" rx="0" fill="#cbd5e1" fill-opacity="1.0" stroke="#f8fafc" stroke-width="1"/><rect x="518.2" y="430.8" width="77.0" height="113.3" rx="8" fill="#1d4ed8" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.8"/><text x="556.7" y="484.2" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">QS138 70H</text><line x1="589.1" y1="513.9" x2="589.1" y2="675.4" stroke="#f59e0b" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="6,3"/><line x1="589.1" y1="461.1" x2="589.1" y2="622.6" stroke="#f59e0b" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="6,3"/><line x1="628.2" y1="649.0" x2="618.2" y2="649.0" stroke="#f59e0b" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3,2"/><line x1="628.2" y1="487.5" x2="618.2" y2="487.5" stroke="#f59e0b" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3,2"/><line x1="614.2" y1="649.0" x2="614.2" y2="487.5" stroke="#f59e0b" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="609.2" y="568.2" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(-90.0,609.2,568.2)" dominant-baseline="auto">294</text><line x1="595.2" y1="454.5" x2="640.0" y2="345.0" stroke="#94a3b8" stroke-width="0.9" stroke-linecap="round"/><circle cx="595.2" cy="454.5" r="2.2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/><text x="644.0" y="349.0" fill="#38bdf8" font-size="11" text-anchor="start" font-weight="normal">QS138: пазы 12x55 — натяжка цепи</text><line x1="589.1" y1="520.5" x2="640.0" y2="375.0" stroke="#94a3b8" stroke-width="0.9" stroke-linecap="round"/><circle cx="589.1" cy="520.5" r="2.2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/><text x="644.0" y="379.0" fill="#f59e0b" font-size="11" text-anchor="start" font-weight="normal">звезды 15T/15T, цепь 520 O-ring</text><line x1="514.4" y1="572.0" x2="640.0" y2="405.0" stroke="#94a3b8" stroke-width="0.9" stroke-linecap="round"/><circle cx="514.4" cy="572.0" r="2.2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/><text x="644.0" y="409.0" fill="#f59e0b" font-size="11" text-anchor="start" font-weight="normal">плита-адаптер t=10 на фланец картера</text><line x1="534.7" y1="627.0" x2="640.0" y2="435.0" stroke="#94a3b8" stroke-width="0.9" stroke-linecap="round"/><circle cx="534.7" cy="627.0" r="2.2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/><text x="644.0" y="439.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">промвал Ø25 в 2x UCF205</text><line x1="526.5" y1="649.0" x2="640.0" y2="465.0" stroke="#94a3b8" stroke-width="0.9" stroke-linecap="round"/><circle cx="526.5" cy="649.0" r="2.2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/><text x="644.0" y="469.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">шлицевая муфта на первичный вал</text><line x1="596.9" y1="599.5" x2="640.0" y2="495.0" stroke="#94a3b8" stroke-width="0.9" stroke-linecap="round"/><circle cx="596.9" cy="599.5" r="2.2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/><text x="644.0" y="499.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">диск стояночного Ø200</text><line x1="711.2" y1="718.9" x2="640.0" y2="545.0" stroke="#94a3b8" stroke-width="0.9" stroke-linecap="round"/><circle cx="711.2" cy="718.9" r="2.2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/><text x="644.0" y="549.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">привод 2108, 445 между ШРУС</text><line x1="290.5" y1="770.0" x2="60.0" y2="545.0" stroke="#94a3b8" stroke-width="0.9" stroke-linecap="round"/><circle cx="290.5" cy="770.0" r="2.2" fill="#94a3b8" stroke="#94a3b8" stroke-width="0"/><text x="64.0" y="549.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">опоры КПП: штатные подушки 2108</text><line x1="378.5" y1="726.0" x2="378.5" y2="790.0" stroke="#38bdf8" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3,2"/><line x1="521.5" y1="726.0" x2="521.5" y2="790.0" stroke="#38bdf8" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3,2"/><line x1="378.5" y1="786.0" x2="521.5" y2="786.0" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="450.0" y="791.0" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(0.0,450.0,791.0)" dominant-baseline="hanging">260*</text><rect x="880.0" y="112.0" width="470.0" height="114.0" rx="3" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1"/><text x="886.0" y="126.0" fill="#38bdf8" font-size="11" text-anchor="start" font-weight="bold">Перед.</text><text x="938.0" y="126.0" fill="#38bdf8" font-size="11" text-anchor="start" font-weight="bold">i КПП</text><text x="1002.0" y="126.0" fill="#38bdf8" font-size="11" text-anchor="start" font-weight="bold">i общ.</text><text x="1072.0" y="126.0" fill="#38bdf8" font-size="11" text-anchor="start" font-weight="bold">V max</text><text x="1152.0" y="126.0" fill="#38bdf8" font-size="11" text-anchor="start" font-weight="bold">M колёс, Нм</text><text x="1262.0" y="126.0" fill="#38bdf8" font-size="11" text-anchor="start" font-weight="bold">Тяга, Н</text><line x1="880.0" y1="132.0" x2="1350.0" y2="132.0" stroke="#64748b" stroke-width="1.0" stroke-linecap="round"/><text x="886.0" y="146.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">1-я</text><text x="938.0" y="146.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">3.636</text><text x="1002.0" y="146.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">33.7</text><text x="1072.0" y="146.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">14</text><text x="1152.0" y="146.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">1745</text><text x="1262.0" y="146.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">6037</text><text x="886.0" y="164.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">2-я</text><text x="938.0" y="164.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">1.950</text><text x="1002.0" y="164.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">18.1</text><text x="1072.0" y="164.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">27</text><text x="1152.0" y="164.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">936</text><text x="1262.0" y="164.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">3238</text><text x="886.0" y="182.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">3-я</text><text x="938.0" y="182.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">1.357</text><text x="1002.0" y="182.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">12.6</text><text x="1072.0" y="182.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">38</text><text x="1152.0" y="182.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">651</text><text x="1262.0" y="182.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">2253</text><text x="886.0" y="200.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">4-я</text><text x="938.0" y="200.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">0.941</text><text x="1002.0" y="200.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">8.7</text><text x="1072.0" y="200.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">55</text><text x="1152.0" y="200.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">452</text><text x="1262.0" y="200.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">1562</text><text x="886.0" y="218.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">5-я</text><text x="938.0" y="218.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">0.784</text><text x="1002.0" y="218.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">7.3</text><text x="1072.0" y="218.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">66</text><text x="1152.0" y="218.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">376</text><text x="1262.0" y="218.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">1302</text><text x="880.0" y="240.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">QS138 2.35 x цепь 15/15 x КПП x 3.94; вход ≤ 135 Нм, ≤ 1872 об/мин</text><rect x="880.0" y="252.0" width="470.0" height="204.0" rx="4" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1"/><text x="892.0" y="274.0" fill="#f59e0b" font-size="13" text-anchor="start" font-weight="bold">ЭКСПЛУАТАЦИЯ И НАСТРОЙКА</text><text x="892.0" y="294.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">4-я — основная (55 км/ч), 2-я — отвал / снег, 1-я — тяжелый выезд.</text><text x="892.0" y="311.0" fill="#f87171" font-size="11" text-anchor="start" font-weight="normal">Ток фаз контроллера ограничить: момент на входе КПП ≤ 135 Нм</text><text x="892.0" y="328.0" fill="#f87171" font-size="11" text-anchor="start" font-weight="normal">(штатный момент двигателя 2108 ≈ 106 Нм). Задний ход — реверсом мотора.</text><text x="892.0" y="345.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Переключать на остановке (сцепления нет), педаль газа отпущена.</text><text x="892.0" y="362.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Сцепление, вилку и выжимной снять; окно картера закрыть крышкой.</text><text x="892.0" y="379.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Масло 75W-90 по уровню контрольной пробки; сапун вывести вверх.</text><text x="892.0" y="396.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Провис цепи 15-20 мм; натяжка — сдвигом мотора по пазам плиты.</text><text x="892.0" y="413.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Мотор, промвал и КПП — на одной плите: цепь не тянет подушки.</text><text x="892.0" y="430.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Мотор можно развернуть вокруг оси промвала (вбок/вперед) —</text><text x="892.0" y="447.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">   межосевое 294 мм (52 звена) сохраняется.</text>

