    <text x="12.0" y="56.0" fill="#94a3b8" font-size="12" text-anchor="start" font-weight="normal">Материал:</text><text x="100.0" y="56.0" fill="#f8fafc" font-size="12" text-anchor="start" font-weight="normal">Плита 10 мм, 2x UCF205</text>
