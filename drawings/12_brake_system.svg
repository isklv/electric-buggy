<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="1400" height="950" style="background:#0f172a; font-family:'Roboto', 'Segoe UI', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#64748b" stroke-width="1.5"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect x="20" y="20" width="1360" height="910" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="50.0" y="62.0" fill="#38bdf8" font-size="22" text-anchor="start" font-weight="bold">ТОРМОЗНАЯ СИСТЕМА: СХЕМА, ПЕДАЛЬНЫЙ УЗЕЛ, СТОЯНОЧНЫЙ ТОРМОЗ</text>
  <text x="50.0" y="88.0" fill="#94a3b8" font-size="14" text-anchor="start" font-weight="normal">Дисковые тормоза ВАЗ-2108 на 4 колеса, ГТЦ 2108, разделение перед/зад, рекуперация</text>
<text x="50.0" y="128.0" fill="#10b981" font-size="14" text-anchor="start" font-weight="bold">ГИДРАВЛИЧЕСКАЯ СХЕМА (раздельные контуры перед / зад)</text><rect x="70.0" y="330.0" width="120.0" height="60.0" rx="6" fill="#1e293b" fill-opacity="1.0" stroke="#f59e0b" stroke-width="1.6"/><text x="130.0" y="360.0" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">ПЕДАЛЬ</text><text x="130.0" y="376.0" fill="#94a3b8" font-size="10" text-anchor="middle" font-weight="normal">i = 4.5</text><rect x="250.0" y="320.0" width="170.0" height="80.0" rx="6" fill="#1e293b" fill-opacity="1.0" stroke="#38bdf8" stroke-width="1.6"/><text x="335.0" y="360.0" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">ГТЦ 2108</text><text x="335.0" y="376.0" fill="#94a3b8" font-size="10" text-anchor="middle" font-weight="normal">Ø20.64 мм, 2 контура</text><rect x="275.0" y="230.0" width="120.0" height="45.0" rx="6" fill="#1e293b" fill-opacity="1.0" stroke="#94a3b8" stroke-width="1.6"/><text x="335.0" y="256.5" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">БАЧОК</text><line x1="335.0" y1="275.0" x2="335.0" y2="320.0" stroke="#94a3b8" stroke-width="2.0" stroke-linecap="round"/><line x1="190.0" y1="360.0" x2="250.0" y2="360.0" stroke="#f59e0b" stroke-width="4.0" stroke-linecap="round"/><rect x="500.0" y="180.0" width="130.0" height="50.0" rx="6" fill="#1e293b" fill-opacity="1.0" stroke="#f87171" stroke-width="1.6"/><text x="565.0" y="209.0" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">ТРОЙНИК</text><rect x="480.0" y="470.0" width="140.0" height="60.0" rx="6" fill="#1e293b" fill-opacity="1.0" stroke="#f87171" stroke-width="1.6"/><text x="550.0" y="500.0" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">РЕГУЛЯТОР</text><text x="550.0" y="516.0" fill="#94a3b8" font-size="10" text-anchor="middle" font-weight="normal">задн. ≈ 55%</text><rect x="640.0" y="475.0" width="80.0" height="50.0" rx="6" fill="#1e293b" fill-opacity="1.0" stroke="#f87171" stroke-width="1.6"/><text x="680.0" y="504.0" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">ТРОЙН.</text><polyline points="420.0,340.0 460.0,340.0 460.0,205.0 500.0,205.0" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#flow)"/><polyline points="420.0,380.0 460.0,380.0 460.0,500.0 480.0,500.0" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#flow)"/><polyline points="620.0,500.0 640.0,500.0" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#flow)"/><rect x="720.0" y="115.0" width="140.0" height="50.0" rx="6" fill="#1e293b" fill-opacity="1.0" stroke="#10b981" stroke-width="1.6"/><text x="790.0" y="140.0" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">СУППОРТ ПЛ</text><text x="790.0" y="156.0" fill="#94a3b8" font-size="10" text-anchor="middle" font-weight="normal">2108, Ø48</text><polyline points="630.0,205.0 680.0,205.0 680.0,140.0 720.0,140.0" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#flow)"/><rect x="720.0" y="225.0" width="140.0" height="50.0" rx="6" fill="#1e293b" fill-opacity="1.0" stroke="#10b981" stroke-width="1.6"/><text x="790.0" y="250.0" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">СУППОРТ ПП</text><text x="790.0" y="266.0" fill="#94a3b8" font-size="10" text-anchor="middle" font-weight="normal">2108, Ø48</text><polyline points="630.0,205.0 680.0,205.0 680.0,250.0 720.0,250.0" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#flow)"/><rect x="740.0" y="395.0" width="120.0" height="50.0" rx="6" fill="#1e293b" fill-opacity="1.0" stroke="#10b981" stroke-width="1.6"/><text x="800.0" y="420.0" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">СУППОРТ ЗЛ</text><text x="800.0" y="436.0" fill="#94a3b8" font-size="10" text-anchor="middle" font-weight="normal">2108, Ø48</text><polyline points="720.0,500.0 730.0,500.0 730.0,420.0 740.0,420.0" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#flow)"/><rect x="740.0" y="555.0" width="120.0" height="50.0" rx="6" fill="#1e293b" fill-opacity="1.0" stroke="#10b981" stroke-width="1.6"/><text x="800.0" y="580.0" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">СУППОРТ ЗП</text><text x="800.0" y="596.0" fill="#94a3b8" font-size="10" text-anchor="middle" font-weight="normal">2108, Ø48</text><polyline points="720.0,500.0 730.0,500.0 730.0,580.0 740.0,580.0" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#flow)"/><text x="560.0" y="160.0" fill="#f87171" font-size="12" text-anchor="middle" font-weight="bold">КОНТУР 1 — ПЕРЕД</text><text x="550.0" y="455.0" fill="#f87171" font-size="12" text-anchor="middle" font-weight="bold">КОНТУР 2 — ЗАД</text><rect x="70.0" y="470.0" width="150.0" height="55.0" rx="6" fill="#1e293b" fill-opacity="1.0" stroke="#f59e0b" stroke-width="1.6"/><text x="145.0" y="497.5" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">Датчик стоп</text><text x="145.0" y="513.5" fill="#94a3b8" font-size="10" text-anchor="middle" font-weight="normal">на педали, 12V</text><line x1="130.0" y1="390.0" x2="130.0" y2="470.0" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4,3"/><rect x="250.0" y="470.0" width="170.0" height="55.0" rx="6" fill="#1e293b" fill-opacity="1.0" stroke="#a78bfa" stroke-width="1.6"/><text x="335.0" y="497.5" fill="#f8fafc" font-size="12" text-anchor="middle" font-weight="bold">Вход EBS / тормоз</text><text x="335.0" y="513.5" fill="#94a3b8" font-size="10" text-anchor="middle" font-weight="normal">контроллер VOTOL</text><line x1="220.0" y1="497.0" x2="250.0" y2="497.0" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4,3"/><text x="250.0" y="545.0" fill="#a78bfa" font-size="10" text-anchor="start" font-weight="normal">рекуперация при нажатии на педаль</text><text x="50.0" y="600.0" fill="#10b981" font-size="14" text-anchor="start" font-weight="bold">ПЕДАЛЬНЫЙ УЗЕЛ (вид сбоку), М 1:5</text><rect x="100.0" y="615.0" width="270.0" height="10.0" rx="0" fill="#d97706" fill-opacity="1.0" stroke="#f59e0b" stroke-width="1.2"/><text x="380.0" y="626.0" fill="#f59e0b" font-size="10" text-anchor="start" font-weight="normal">кронштейн на щите / поперечине</text><line x1="150.0" y1="640.0" x2="190.0" y2="883.0" stroke="#f8fafc" stroke-width="8.0" stroke-linecap="round"/><rect x="160.0" y="879.0" width="60.0" height="12.0" rx="3" fill="#475569" fill-opacity="1.0" stroke="#f8fafc" stroke-width="1.2"/><circle cx="150.0" cy="640.0" r="8.0" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><circle cx="158.9" cy="694.0" r="5.0" fill="#f59e0b" stroke="#f59e0b" stroke-width="0"/><line x1="158.9" y1="694.0" x2="358.9" y2="684.0" stroke="#f59e0b" stroke-width="4.0" stroke-linecap="round"/><rect x="358.9" y="664.0" width="90.0" height="40.0" rx="4" fill="#1e293b" fill-opacity="1.0" stroke="#38bdf8" stroke-width="1.5"/><text x="403.9" y="689.0" fill="#f8fafc" font-size="11" text-anchor="middle" font-weight="normal">ГТЦ</text><line x1="150.0" y1="640.0" x2="167.8" y2="637.1" stroke="#38bdf8" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3,2"/><line x1="158.9" y1="694.0" x2="176.6" y2="691.1" stroke="#38bdf8" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3,2"/><line x1="171.7" y1="636.4" x2="180.6" y2="690.4" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="181.1" y="662.6" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(80.7,181.1,662.6)" dominant-baseline="auto">60</text><line x1="150.0" y1="640.0" x2="106.6" y2="647.1" stroke="#38bdf8" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3,2"/><line x1="190.0" y1="883.0" x2="146.6" y2="890.1" stroke="#38bdf8" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3,2"/><line x1="110.5" y1="646.5" x2="150.5" y2="889.5" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="125.6" y="768.8" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(80.7,125.6,768.8)" dominant-baseline="hanging">270</text><text x="330.0" y="880.0" fill="#94a3b8" font-size="11" text-anchor="start" font-weight="normal">Передаточное педали 4.5:1 (270/60)</text><rect x="880.0" y="112.0" width="470.0" height="136.0" rx="4" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1"/><text x="892.0" y="134.0" fill="#38bdf8" font-size="13" text-anchor="start" font-weight="bold">РАСЧЕТ (4 тормоза 2108, без усилителя)</text><text x="892.0" y="154.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Полная масса 650 кг, замедление 0.8 g</text><text x="892.0" y="171.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Давление в системе 2.6 МПа (у 2108 штатно до ~10 МПа)</text><text x="892.0" y="188.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Усилие на педали 197 Н (~20 кгс) — без вакуума</text><text x="892.0" y="205.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Нагрузка на перед при торможении 65%</text><text x="892.0" y="222.0" fill="#f87171" font-size="11" text-anchor="start" font-weight="normal">Одинаковые суппорты по кругу -&gt; зад блокируется первым:</text><text x="892.0" y="239.0" fill="#f87171" font-size="11" text-anchor="start" font-weight="normal">регулируемый клапан в задний контур обязателен.</text><rect x="880.0" y="290.0" width="470.0" height="102.0" rx="4" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1"/><text x="892.0" y="312.0" fill="#f59e0b" font-size="13" text-anchor="start" font-weight="bold">СТОЯНОЧНЫЙ ТОРМОЗ</text><text x="892.0" y="332.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">У суппортов 2108 нет ручника. Решение: механический суппорт</text><text x="892.0" y="349.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">(тросовый, ATV/багги) на диске Ø200 на промвале (лист 11).</text><text x="892.0" y="366.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Работает через КПП: включить передачу + рычаг ручника.</text><text x="892.0" y="383.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Момент на диске умножается передаточным числом -&gt; малый диск.</text><rect x="880.0" y="430.0" width="470.0" height="136.0" rx="4" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="1"/><text x="892.0" y="452.0" fill="#10b981" font-size="13" text-anchor="start" font-weight="bold">МОНТАЖ МАГИСТРАЛЕЙ</text><text x="892.0" y="472.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Трубки стальные медненые Ø4.75 (3/16"), развальцовка DIN.</text><text x="892.0" y="489.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Крепление к раме хомутами через 300 мм, вдали от цепи и АКБ.</text><text x="892.0" y="506.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Гибкие шланги 2108 к суппортам: длину проверить на полном ходе</text><text x="892.0" y="523.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">сжатия/отбоя и в крайних положениях руля (не натянут, не трет).</text><text x="892.0" y="540.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Штуцеры M10x1; прокачка: ЗП -&gt; ЗЛ -&gt; ПП -&gt; ПЛ.</text><text x="892.0" y="557.0" fill="#f8fafc" font-size="11" text-anchor="start" font-weight="normal">Жидкость DOT-4. Задний регулятор — по месту, на заезде.</text>

  <g transform="translate(980, 812)">
    <rect width="380" height="104" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="0" y1="34" x2="380" y2="34" stroke="#64748b"/><line x1="0" y1="68" x2="380" y2="68" stroke="#64748b"/>
    <line x1="90" y1="0" x2="90" y2="104" stroke="#64748b"/>
    <text x="12.0" y="22.0" fill="#94a3b8" font-size="12" text-anchor="start" font-weight="normal">Узел:</text><text x="100.0" y="22.0" fill="#f8fafc" font-size="13" text-anchor="start" font-weight="bold">Тормозная система</text>
    <text x="12.0" y="56.0" fill="#94a3b8" font-size="12" text-anchor="start" font-weight="normal">Материал:</text><text x="100.0" y="56.0" fill="#f8fafc" font-size="12" text-anchor="start" font-weight="normal">Узлы ВАЗ-2108</text>
    <text x="12.0" y="90.0" fill="#94a3b8" font-size="12" text-anchor="start" font-weight="normal">Чертеж:</text><text x="100.0" y="90.0" fill="#38bdf8" font-size="12" text-anchor="start" font-weight="normal">12-BRAKES / схема / М 1:5 / лист 12</text>
  </g>
</svg>